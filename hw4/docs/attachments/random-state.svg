<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" role="img" aria-labelledby="title desc"><title id="title">Local static random state</title><desc id="desc">Three calls share one stored state. Positive seed resets; zero continues.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f79"/></marker></defs><rect width="960" height="412" rx="16" fill="#f7faf7"/><g font-family="system-ui, -apple-system, sans-serif"><text x="36" y="42" font-size="23" fill="#163337" text-anchor="start">Both games · One local static unsigned int keeps the sequence</text><text x="36" y="80" font-size="18" fill="#163337" text-anchor="start">The name is local to nextRandom; the stored value lasts for the process.</text><rect x="45" y="115" width="260" height="116" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><text x="175" y="153" font-size="21" fill="#163337" text-anchor="middle">nextRandom(1)</text><text x="175" y="201" font-size="23" fill="#087f79" text-anchor="middle">state = 1130</text><path d="M308,173 L346,173" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="350" y="115" width="260" height="116" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><text x="480" y="153" font-size="21" fill="#163337" text-anchor="middle">nextRandom(0)</text><text x="480" y="201" font-size="23" fill="#087f79" text-anchor="middle">state = 25887</text><path d="M613,173 L651,173" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="655" y="115" width="260" height="116" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><text x="785" y="153" font-size="21" fill="#163337" text-anchor="middle">nextRandom(0)</text><text x="785" y="201" font-size="23" fill="#087f79" text-anchor="middle">state = 4656</text><text x="36" y="286" font-size="20" fill="#163337" text-anchor="start">seed &gt; 0: reset first. seed == 0: continue from the stored state.</text><text x="36" y="332" font-size="18" fill="#163337" text-anchor="start">Retry a round: keep the sequence. New process: create a new static variable.</text><text x="36" y="378" font-size="19" fill="#c75527" text-anchor="start">A plain local unsigned int would be initialized again on every call.</text></g></svg>
