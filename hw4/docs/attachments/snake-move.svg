<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" role="img" aria-labelledby="title desc"><title id="title">P1 normal move</title><desc id="desc">Tail A becomes the head; B becomes the tail. Other nodes keep their positions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f79"/></marker></defs><rect width="960" height="444" rx="16" fill="#f7faf7"/><g font-family="system-ui, -apple-system, sans-serif"><text x="36" y="42" font-size="23" fill="#163337" text-anchor="start">P1 · Normal move: reuse the old tail</text><text x="36" y="76" font-size="17" fill="#163337" text-anchor="start">One step to the right. Letters identify nodes; labels show their roles.</text><text x="36" y="149" font-size="18" fill="#163337" text-anchor="start">Before</text><rect x="180" y="115" width="104" height="68" rx="10" fill="#d8eee7" stroke="#97b7ab" stroke-width="2"/><text x="232" y="144" font-size="22" fill="#163337" text-anchor="middle">A</text><text x="232" y="169" font-size="15" fill="#163337" text-anchor="middle">tail</text><rect x="308" y="115" width="104" height="68" rx="10" fill="#d8eee7" stroke="#97b7ab" stroke-width="2"/><text x="360" y="144" font-size="22" fill="#163337" text-anchor="middle">B</text><text x="360" y="169" font-size="15" fill="#163337" text-anchor="middle"></text><rect x="436" y="115" width="104" height="68" rx="10" fill="#d8eee7" stroke="#97b7ab" stroke-width="2"/><text x="488" y="144" font-size="22" fill="#163337" text-anchor="middle">C</text><text x="488" y="169" font-size="15" fill="#163337" text-anchor="middle"></text><rect x="564" y="115" width="104" height="68" rx="10" fill="#ffe4d5" stroke="#c75527" stroke-width="2"/><text x="616" y="144" font-size="22" fill="#163337" text-anchor="middle">D</text><text x="616" y="169" font-size="15" fill="#163337" text-anchor="middle">head</text><rect x="692" y="115" width="104" height="68" rx="10" fill="#fff" stroke="#97b7ab" stroke-width="2"/><text x="744" y="144" font-size="22" fill="#163337" text-anchor="middle">empty</text><text x="744" y="169" font-size="15" fill="#163337" text-anchor="middle"></text><text x="36" y="291" font-size="18" fill="#163337" text-anchor="start">After</text><rect x="180" y="257" width="104" height="68" rx="10" fill="#fff" stroke="#97b7ab" stroke-width="2"/><text x="232" y="286" font-size="22" fill="#163337" text-anchor="middle">empty</text><text x="232" y="311" font-size="15" fill="#163337" text-anchor="middle"></text><rect x="308" y="257" width="104" height="68" rx="10" fill="#d8eee7" stroke="#97b7ab" stroke-width="2"/><text x="360" y="286" font-size="22" fill="#163337" text-anchor="middle">B</text><text x="360" y="311" font-size="15" fill="#163337" text-anchor="middle">tail</text><rect x="436" y="257" width="104" height="68" rx="10" fill="#d8eee7" stroke="#97b7ab" stroke-width="2"/><text x="488" y="286" font-size="22" fill="#163337" text-anchor="middle">C</text><text x="488" y="311" font-size="15" fill="#163337" text-anchor="middle"></text><rect x="564" y="257" width="104" height="68" rx="10" fill="#d8eee7" stroke="#97b7ab" stroke-width="2"/><text x="616" y="286" font-size="22" fill="#163337" text-anchor="middle">D</text><text x="616" y="311" font-size="15" fill="#163337" text-anchor="middle"></text><rect x="692" y="257" width="104" height="68" rx="10" fill="#ffe4d5" stroke="#c75527" stroke-width="2"/><text x="744" y="286" font-size="22" fill="#163337" text-anchor="middle">A</text><text x="744" y="311" font-size="15" fill="#163337" text-anchor="middle">head</text><text x="180" y="224" font-size="18" fill="#163337" text-anchor="start">→  Reuse A as the head; B becomes the tail.</text><text x="36" y="375" font-size="20" fill="#087f79" text-anchor="start">Nodes: 4 → 4. No allocation or release.</text><text x="36" y="412" font-size="18" fill="#163337" text-anchor="start">On a normal move, the old tail cell becomes free.</text></g></svg>
