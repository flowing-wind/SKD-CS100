<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 316" role="img" aria-labelledby="title desc"><title id="title">Sanitizer workflow</title><desc id="desc">Build with ASan/UBSan, run edge cases, locate the first report, fix and retest.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f79"/></marker></defs><rect width="960" height="316" rx="16" fill="#f7faf7"/><g font-family="system-ui, -apple-system, sans-serif"><text x="36" y="42" font-size="23" fill="#163337" text-anchor="start">Check memory and undefined behavior, even when the game runs</text><rect x="28" y="90" width="205" height="116" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><text x="42" y="133" font-size="19" fill="#163337" text-anchor="start">make debug</text><text x="42" y="173" font-size="13" fill="#163337" text-anchor="start">Build checked programs</text><path d="M235,149 L258,149" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="262" y="90" width="205" height="116" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><text x="276" y="133" font-size="19" fill="#163337" text-anchor="start">Exercise cases</text><text x="276" y="173" font-size="13" fill="#163337" text-anchor="start">Rings / pipes / scores</text><path d="M469,149 L492,149" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="496" y="90" width="205" height="116" rx="10" fill="#ffe4d5" stroke="#087f79" stroke-width="2"/><text x="510" y="133" font-size="19" fill="#163337" text-anchor="start">Read first report</text><text x="510" y="173" font-size="13" fill="#163337" text-anchor="start">Type + call stack + line</text><path d="M703,149 L726,149" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="730" y="90" width="205" height="116" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><text x="744" y="133" font-size="19" fill="#163337" text-anchor="start">Fix and retest</text><text x="744" y="173" font-size="13" fill="#163337" text-anchor="start">Repeat for each tested case</text><text x="36" y="250" font-size="18" fill="#163337" text-anchor="start">ASan: bounds, use after free, double free. UBSan: detectable undefined behavior.</text><text x="36" y="286" font-size="16" fill="#163337" text-anchor="start">Use LSan for leaks on supported platforms. No report is not proof that all paths are safe.</text></g></svg>
