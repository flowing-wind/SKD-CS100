<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc"><title id="title">Framework and student responsibilities</title><desc id="desc">The framework reads input; student code manages data and rules; the framework advances and draws.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f79"/></marker></defs><rect width="960" height="300" rx="16" fill="#f7faf7"/><g font-family="system-ui, -apple-system, sans-serif"><text x="36" y="42" font-size="23" fill="#163337" text-anchor="start">A game frame: where does your code fit?</text><rect x="28" y="88" width="205" height="140" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><text x="46" y="120" font-size="18" fill="#087f79" text-anchor="start">01</text><text x="46" y="159" font-size="20" fill="#163337" text-anchor="start">Read input</text><text x="46" y="195" font-size="14" fill="#163337" text-anchor="start">Turn / move / jump</text><path d="M235,156 L258,156" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="262" y="88" width="205" height="140" rx="10" fill="#ffe4d5" stroke="#c75527" stroke-width="2"/><text x="280" y="120" font-size="18" fill="#c75527" text-anchor="start">02</text><text x="280" y="159" font-size="20" fill="#163337" text-anchor="start">Your logic</text><text x="280" y="195" font-size="14" fill="#163337" text-anchor="start">P1 ring / P2 pipes</text><path d="M469,156 L492,156" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="496" y="88" width="205" height="140" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><text x="514" y="120" font-size="18" fill="#087f79" text-anchor="start">03</text><text x="514" y="159" font-size="20" fill="#163337" text-anchor="start">Advance game</text><text x="514" y="195" font-size="14" fill="#163337" text-anchor="start">Score / physics / results</text><path d="M703,156 L726,156" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="730" y="88" width="205" height="140" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><text x="748" y="120" font-size="18" fill="#087f79" text-anchor="start">04</text><text x="748" y="159" font-size="20" fill="#163337" text-anchor="start">Draw frame</text><text x="748" y="195" font-size="14" fill="#163337" text-anchor="start">Terminal / camera / color</text><text x="36" y="271" font-size="17" fill="#163337" text-anchor="start">Responsibilities only; see each framework for exact call order. Input and display are provided.</text></g></svg>
