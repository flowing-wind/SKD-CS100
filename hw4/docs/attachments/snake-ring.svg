<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 334" role="img" aria-labelledby="title desc"><title id="title">P1 circular list</title><desc id="desc">Tail A links to B, C, head D, then A again. The head links to the tail.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f79"/></marker></defs><rect width="960" height="334" rx="16" fill="#f7faf7"/><g font-family="system-ui, -apple-system, sans-serif"><text x="36" y="42" font-size="23" fill="#163337" text-anchor="start">P1 · Node order is not screen position</text><text x="36" y="77" font-size="17" fill="#163337" text-anchor="start">Arrows are m_next links. A / B / C / D identify nodes.</text><rect x="82" y="120" width="130" height="76" rx="10" fill="#d8eee7" stroke="#087f79" stroke-width="2"/><text x="147" y="153" font-size="24" fill="#163337" text-anchor="middle">A</text><text x="147" y="178" font-size="17" fill="#163337" text-anchor="middle">tail</text><path d="M214,158 L300,158" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="302" y="120" width="130" height="76" rx="10" fill="#d8eee7" stroke="#087f79" stroke-width="2"/><text x="367" y="153" font-size="24" fill="#163337" text-anchor="middle">B</text><text x="367" y="178" font-size="17" fill="#163337" text-anchor="middle">body</text><path d="M434,158 L520,158" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="522" y="120" width="130" height="76" rx="10" fill="#d8eee7" stroke="#087f79" stroke-width="2"/><text x="587" y="153" font-size="24" fill="#163337" text-anchor="middle">C</text><text x="587" y="178" font-size="17" fill="#163337" text-anchor="middle">body</text><path d="M654,158 L740,158" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="742" y="120" width="130" height="76" rx="10" fill="#ffe4d5" stroke="#087f79" stroke-width="2"/><text x="807" y="153" font-size="24" fill="#163337" text-anchor="middle">D</text><text x="807" y="178" font-size="17" fill="#163337" text-anchor="middle">head</text><path d="M807,198 V240 H147 V199" fill="none" stroke="#087f79" stroke-width="2.5" marker-end="url(#arrow)"/><text x="477" y="273" font-size="19" fill="#163337" text-anchor="middle">m_head points to D; D-&gt;m_next points to A (the tail).</text><text x="477" y="306" font-size="17" fill="#163337" text-anchor="middle">No NULL link. Follow m_length links to return to the start.</text></g></svg>
