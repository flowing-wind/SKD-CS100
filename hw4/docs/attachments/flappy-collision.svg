<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 535" role="img" aria-labelledby="title desc"><title id="title">Flappy Bird collision boxes</title><desc id="desc">The gap lies between upper and lower rectangular obstacles; touching alone is not overlap.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f79"/></marker></defs><rect width="960" height="535" rx="16" fill="#f7faf7"/><g font-family="system-ui, -apple-system, sans-serif"><text x="36" y="42" font-size="23" fill="#163337" text-anchor="start">P2 · One pipe slot describes two rectangles and a gap</text><rect x="500" y="82" width="110" height="110" rx="10" fill="#d8eee7" stroke="#087f79" stroke-width="2"/><rect x="500" y="325" width="110" height="108" rx="10" fill="#d8eee7" stroke="#087f79" stroke-width="2"/><rect x="490" y="192" width="130" height="133" rx="10" fill="#fff" stroke="#b9d5c7" stroke-width="2"/><text x="650" y="140" font-size="20" fill="#163337" text-anchor="start">Upper pipe</text><text x="650" y="258" font-size="20" fill="#163337" text-anchor="start">Open gap</text><text x="650" y="385" font-size="20" fill="#163337" text-anchor="start">Lower pipe</text><rect x="345" y="245" width="55" height="36" rx="10" fill="#ffe4d5" stroke="#087f79" stroke-width="2"/><text x="92" y="267" font-size="20" fill="#163337" text-anchor="start">Bird bounding box</text><path d="M410,263 L485,263" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="35" y="470" font-size="19" fill="#163337" text-anchor="start">Check the top/floor bounds and both pipe boxes with boxesOverlap.</text><text x="35" y="505" font-size="17" fill="#163337" text-anchor="start">A bird fully inside the gap is safe. Merely touching a rectangle edge is not overlap.</text></g></svg>
