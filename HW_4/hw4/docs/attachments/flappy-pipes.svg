<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 426" role="img" aria-labelledby="title desc"><title id="title">Flappy Bird pipe array</title><desc id="desc">Move all four slots, then recycle off-screen slots using the provided helper.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f79"/></marker></defs><rect width="960" height="426" rx="16" fill="#f7faf7"/><g font-family="system-ui, -apple-system, sans-serif"><text x="36" y="42" font-size="23" fill="#163337" text-anchor="start">P2 · Move the fixed pipe array, then reuse off-screen slots</text><text x="36" y="78" font-size="17" fill="#163337" text-anchor="start">Every slot is one upper/lower pipe pair. No allocation or node links.</text><rect x="45" y="125" width="180" height="95" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><text x="135" y="162" font-size="23" fill="#163337" text-anchor="middle">Pipe [0]</text><text x="135" y="197" font-size="16" fill="#163337" text-anchor="middle">m_x moves left</text><rect x="275" y="125" width="180" height="95" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><text x="365" y="162" font-size="23" fill="#163337" text-anchor="middle">Pipe [1]</text><text x="365" y="197" font-size="16" fill="#163337" text-anchor="middle">m_x moves left</text><rect x="505" y="125" width="180" height="95" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><text x="595" y="162" font-size="23" fill="#163337" text-anchor="middle">Pipe [2]</text><text x="595" y="197" font-size="16" fill="#163337" text-anchor="middle">m_x moves left</text><rect x="735" y="125" width="180" height="95" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><text x="825" y="162" font-size="23" fill="#163337" text-anchor="middle">Pipe [3]</text><text x="825" y="197" font-size="16" fill="#163337" text-anchor="middle">m_x moves left</text><path d="M845,265 L110,265" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="480" y="305" font-size="20" fill="#163337" text-anchor="middle">1. Subtract PIPE_SPEED × dt from every m_x.</text><text x="480" y="350" font-size="19" fill="#163337" text-anchor="middle">2. Visit slots in order; recycle those with right edge &lt;= 0.</text><text x="480" y="393" font-size="17" fill="#163337" text-anchor="middle">The helper chooses the new position/gap and clears m_scored.</text></g></svg>
