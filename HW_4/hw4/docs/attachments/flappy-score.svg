<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 462" role="img" aria-labelledby="title desc"><title id="title">Flappy Bird one-time score flag</title><desc id="desc">A pipe behind the bird scores once until its slot is recycled.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#087f79"/></marker></defs><rect width="960" height="462" rx="16" fill="#f7faf7"/><g font-family="system-ui, -apple-system, sans-serif"><text x="36" y="42" font-size="23" fill="#163337" text-anchor="start">P2 · One pass, one point</text><text x="36" y="78" font-size="18" fill="#163337" text-anchor="start">A pass counts when pipe.m_x + PIPE_WIDTH &lt; BIRD_X.</text><rect x="240" y="130" width="100" height="150" rx="10" fill="#e6f2ee" stroke="#087f79" stroke-width="2"/><rect x="590" y="185" width="60" height="40" rx="10" fill="#ffe4d5" stroke="#087f79" stroke-width="2"/><path d="M590,105 V310" stroke="#087f79" stroke-width="2" stroke-dasharray="6 5"/><text x="590" y="340" font-size="19" fill="#163337" text-anchor="middle">BIRD_X</text><path d="M350,208 L565,208" stroke="#087f79" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="36" y="388" font-size="21" fill="#163337" text-anchor="start">m_scored = false → add 1 point → m_scored = true</text><text x="36" y="428" font-size="18" fill="#163337" text-anchor="start">Calling again adds zero. Recycling clears the flag for the next pass.</text></g></svg>
